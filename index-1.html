<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Qual Carro Você Escolheria?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: tela única de toque. Duelo em duas colunas, nome acima da foto, cada coluna é um botão.
   Identidade: placa de rua e faixa de estrada tracejada sob cada ilustração. */
:root {
  --font-display: "Barlow Condensed", "Arial Narrow", Arial, sans-serif;
  --font-body: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;

  --bg: #e8ecef;
  --surface: #f6f8f9;
  --surface-2: #dbe2e7;
  --stage: #dfe6ea;
  --ink: #121c25;
  --ink-2: #55636f;
  --line: #bcc7cf;
  --accent: #0b7f83;
  --accent-ink: #ffffff;
  --gold: #e0a200;
  --gold-ink: #1d1400;
  --glass: #b9d1de;
  --arch: #1b2127;
  --outline: rgba(10, 20, 30, 0.5);
  --shadow: rgba(10, 20, 30, 0.2);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0d1418;
    --surface: #16212a;
    --surface-2: #1f2d38;
    --stage: #101a21;
    --ink: #e9eff2;
    --ink-2: #94a4af;
    --line: #2d3e4a;
    --accent: #3fc7c2;
    --accent-ink: #05201f;
    --gold: #ffbf2f;
    --gold-ink: #1d1400;
    --glass: #46657a;
    --arch: #05080a;
    --outline: rgba(0, 0, 0, 0.65);
    --shadow: rgba(0, 0, 0, 0.55);
    color-scheme: dark;
  }
}

[hidden] { display: none !important; }
html {
  box-sizing: border-box;
  height: 100%;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  background: var(--bg);
}
*, *::before, *::after { box-sizing: inherit; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.4;
  min-height: 100%;
  padding-block: 14px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex;
  flex-direction: column;
  -webkit-text-size-adjust: 100%;
}
main {
  flex: 1;
  width: 100%;
  max-width: 560px;
  margin-inline: auto;
  display: flex;
  flex-direction: column;
}
main > section { flex: 1; display: flex; flex-direction: column; gap: 14px; min-width: 0; }

button { font: inherit; color: inherit; touch-action: manipulation; -webkit-tap-highlight-color: transparent; cursor: pointer; }
button:focus-visible, a:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
a { color: var(--accent); }

.mono { font-family: var(--font-mono); font-weight: 500; font-size: 11px; letter-spacing: 0.09em; text-transform: uppercase; }

/* Ilustração (SVG) usada quando o carro não tem foto */
.car { display: block; width: 100%; height: auto; max-width: 300px; }
.car .road { stroke: var(--line); stroke-width: 2; stroke-dasharray: 10 8; }
.car .shd { fill: var(--shadow); }
.car .body { stroke: var(--outline); stroke-width: 1.4; stroke-linejoin: round; }
.car .glass { fill: var(--glass); }
.car .dark { fill: rgba(0, 0, 0, 0.35); }
.car .arch { fill: var(--arch); }
.car .tire { fill: #171a1e; }
.car .rim { fill: #cfd4da; }
.car .hub { fill: #6b727a; }
.car .hl { fill: #fff3b8; }
.car .tl { fill: #d63a3a; }

/* Palco da imagem: foto por cima, ilustração por baixo */
.stage {
  background: var(--stage);
  border-radius: 8px;
  display: grid;
  place-items: center;
  position: relative;
  overflow: hidden;
  aspect-ratio: 4 / 3;
  padding: 6px 4px 4px;
}
.stage .car { max-width: 92%; }
.foto {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: contain;
  background: var(--stage);
  opacity: 0;
  transition: opacity 0.25s;
}
.foto.ok { opacity: 1; }

/* Início */
.hero-title {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: clamp(44px, 14vw, 68px);
  line-height: 0.92;
  letter-spacing: -0.01em;
  text-wrap: balance;
  margin: 18px 0 0;
}
.hero-sub { color: var(--ink-2); max-width: 42ch; margin: 0; }
.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.tile {
  background: var(--surface);
  border: 2px solid var(--line);
  border-radius: 14px;
  padding: 10px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  text-align: left;
  min-width: 0;
  transition: transform 0.12s, border-color 0.12s;
}
.tile:active { transform: scale(0.975); border-color: var(--accent); }
.tile .stage { aspect-ratio: auto; padding: 10px 8px 4px; }
.tile-name { font-family: var(--font-display); font-weight: 700; font-size: 26px; line-height: 1; }
.tile-desc { color: var(--ink-2); font-size: 14px; line-height: 1.25; }
.tile-last { color: var(--ink-2); font-size: 12px; margin-top: auto; }
.tile-last b { color: var(--ink); font-weight: 600; }
.foot { color: var(--ink-2); font-size: 13px; margin: 4px 0 0; }

/* Jogo */
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 46px; }
.back {
  min-height: 44px;
  padding: 0 14px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 8px;
  font-weight: 600;
  font-size: 15px;
}
.count { color: var(--ink-2); font-variant-numeric: tabular-nums; }
.bar { height: 6px; background: var(--surface-2); border-radius: 3px; overflow: hidden; }
.bar > i { display: block; height: 100%; width: 0; background: var(--accent); transition: width 0.3s; }
.prompt { font-family: var(--font-display); font-weight: 700; font-size: 34px; line-height: 1; margin: 2px 0 0; text-wrap: balance; }
.hint { color: var(--ink-2); font-size: 14px; margin: -6px 0 0; }

.duel { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; position: relative; }
.car-btn {
  background: var(--surface);
  border: 2px solid var(--line);
  border-radius: 14px;
  padding: 12px 10px 10px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  text-align: left;
  min-width: 0;
  transition: transform 0.18s, opacity 0.18s, border-color 0.18s, background 0.18s;
  animation: pop 0.24s ease-out backwards;
}
.car-btn:active { transform: scale(0.98); }
.car-btn .brand { color: var(--ink-2); line-height: 1.3; margin-bottom: 3px; }
.car-btn .name {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: clamp(24px, 7.2vw, 30px);
  line-height: 1;
  text-transform: uppercase;
  overflow-wrap: break-word;
  min-height: 2em;
}
.car-btn .det { color: var(--ink-2); margin-top: 2px; min-height: 1.4em; overflow-wrap: anywhere; }
.credit { color: var(--ink-2); font-size: 11px; line-height: 1.25; margin-top: -4px; overflow-wrap: anywhere; }
.tag { align-self: flex-start; margin-top: auto; padding: 4px 7px; border-radius: 4px; border: 1px solid var(--line); color: var(--ink-2); }
.tag.keep { background: var(--gold); border-color: var(--gold); color: var(--gold-ink); }
.car-btn.picked { border-color: var(--accent); background: var(--surface-2); transform: scale(1.02); }
.car-btn.dim { opacity: 0.3; transform: scale(0.97); }
.vs {
  position: absolute;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  z-index: 2;
  pointer-events: none;
  background: var(--surface);
  color: var(--ink);
  border: 2px solid var(--ink);
  border-radius: 6px;
  padding: 6px 8px;
  font-size: 13px;
}
@keyframes pop { from { opacity: 0; transform: translateY(10px); } }

/* Fim */
.win-card {
  background: var(--surface);
  border: 2px solid var(--gold);
  border-radius: 14px;
  padding: 14px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.win-name { font-family: var(--font-display); font-weight: 700; font-size: 46px; line-height: 0.95; text-transform: uppercase; }
.win-meta { color: var(--ink-2); }
.win-credit { color: var(--ink-2); font-size: 13px; overflow-wrap: anywhere; }
.log-title { margin: 8px 0 0; color: var(--ink-2); }
.log { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.log li { display: grid; grid-template-columns: 2.2em 1fr; gap: 8px; padding: 9px 0; border-top: 1px solid var(--line); font-size: 15px; }
.log .n { color: var(--ink-2); font-variant-numeric: tabular-nums; }
.log b { font-weight: 600; }
.log s { color: var(--ink-2); text-decoration-thickness: 1px; }
.actions { display: flex; flex-direction: column; gap: 10px; margin-top: 6px; }
.btn {
  min-height: 54px;
  border-radius: 10px;
  border: 2px solid var(--line);
  background: var(--surface);
  font-weight: 600;
  font-size: 17px;
}
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }

@media (prefers-reduced-motion: reduce) {
  .car-btn, .tile, .bar > i, .foto { transition: none; }
  .car-btn { animation: none; }
}
</style>
</head>
<body>
<main>
  <section id="home">
    <h1 class="hero-title">Qual carro você escolheria?</h1>
    <p class="hero-sub">Escolha uma categoria. Em cada rodada, o carro que você escolher enfrenta um novo concorrente, até sobrar um só.</p>
    <div class="tiles" id="tiles"></div>
    <p class="foot" id="foot" hidden>Fotos da Wikimedia Commons. O crédito de cada foto aparece no duelo.</p>
  </section>

  <section id="game" hidden>
    <div class="top">
      <button class="back" id="back" type="button">← Categorias</button>
      <span class="count mono" id="count" aria-live="polite"></span>
    </div>
    <div class="bar" aria-hidden="true"><i id="bar"></i></div>
    <h2 class="prompt">Qual você escolheria?</h2>
    <p class="hint" id="hint"></p>
    <div class="duel" id="duel"></div>
  </section>

  <section id="end" hidden>
    <div class="top">
      <button class="back" id="back2" type="button">← Categorias</button>
      <span class="count mono" id="endcat"></span>
    </div>
    <div class="win-card" id="win"></div>
    <h3 class="log-title mono">Duelos desta partida</h3>
    <ol class="log" id="log"></ol>
    <div class="actions">
      <button class="btn primary" id="again" type="button">Jogar de novo</button>
      <button class="btn" id="other" type="button">Outra categoria</button>
    </div>
  </section>
</main>

<script>
(function () {
  // ---------- Lista padrão (ilustrações) ----------
  // [marca, modelo, cor da carroceria, formato (opcional)]
  var BASE = [
    { id: "hatch", nome: "Hatches", desc: "Compactos de dia a dia", shape: "hatch", cars: [
      ["Fiat", "Argo", "#d23b3b"], ["Volkswagen", "Polo", "#2f5d8a"], ["Chevrolet", "Onix", "#eef1f3"],
      ["Hyundai", "HB20", "#1f7a8c"], ["Renault", "Kwid", "#e07b00"], ["Peugeot", "208", "#143a73"],
      ["Toyota", "Yaris", "#9aa1aa"], ["Honda", "Fit", "#7a1f3d"], ["Fiat", "Mobi", "#f2c200"],
      ["Citroën", "C3", "#6a4fb0"] ] },
    { id: "sedan", nome: "Sedãs", desc: "Três volumes", shape: "sedan", cars: [
      ["Toyota", "Corolla", "#c9ced4"], ["Honda", "Civic", "#1d2a38"], ["Chevrolet", "Cruze", "#a32a2a"],
      ["Volkswagen", "Jetta", "#3d5a73"], ["Nissan", "Sentra", "#7d8791"], ["Hyundai", "Elantra", "#e9ecef"],
      ["Mazda", "3", "#8f1d1d"], ["Kia", "Cerato", "#2b6b5a"], ["Volkswagen", "Virtus", "#d8dce0"],
      ["Chevrolet", "Onix Plus", "#2f5d8a"] ] },
    { id: "suv", nome: "SUVs", desc: "Altos e versáteis", shape: "suv", cars: [
      ["Jeep", "Compass", "#2c3e2f"], ["Toyota", "Corolla Cross", "#e4e7ea"], ["Hyundai", "Creta", "#c6471f"],
      ["Volkswagen", "T-Cross", "#2f6fa3"], ["Honda", "HR-V", "#8b929b"], ["Chevrolet", "Tracker", "#b33030"],
      ["Nissan", "Kicks", "#e8a40c"], ["Fiat", "Pulse", "#4d3b8a"], ["Renault", "Duster", "#5f6b3a"],
      ["Jeep", "Renegade", "#d98b0b"] ] },
    { id: "picape", nome: "Picapes", desc: "Cabine e caçamba", shape: "pickup", cars: [
      ["Fiat", "Toro", "#8a2a2a"], ["Toyota", "Hilux", "#dfe3e6"], ["Ford", "Ranger", "#2b4a7a"],
      ["Chevrolet", "S10", "#4a5560"], ["Volkswagen", "Amarok", "#1e3a4f"], ["Fiat", "Strada", "#c93a2a"],
      ["Mitsubishi", "L200 Triton", "#9ba2aa"], ["Nissan", "Frontier", "#7a3a1a"], ["Chevrolet", "Montana", "#e0a210"],
      ["Ram", "1500", "#1b1f24"] ] },
    { id: "esportivo", nome: "Esportivos", desc: "Desempenho acima de tudo", shape: "sport", cars: [
      ["Porsche", "911", "#e0b400"], ["Chevrolet", "Corvette", "#c1272d"], ["Ford", "Mustang", "#2457a6"],
      ["Nissan", "GT-R", "#aeb4bb"], ["Toyota", "GR Supra", "#e8ebee"], ["BMW", "M3", "#1f6f6a"],
      ["Audi", "R8", "#4a525b"], ["Lamborghini", "Huracán", "#8bc01f"], ["Mazda", "MX-5", "#9b1c24"],
      ["Dodge", "Challenger", "#6a2a8c"] ] },
    { id: "eletrico", nome: "Elétricos", desc: "Sem uma gota de combustível", shape: "hatch", cars: [
      ["BYD", "Dolphin", "#2d8fbf", "hatch"], ["Tesla", "Model 3", "#c8ccd1", "sedan"], ["BYD", "Seal", "#1d3557", "sedan"],
      ["Volvo", "EX30", "#8fb0a5", "suv"], ["Hyundai", "Ioniq 5", "#9aa5ad", "suv"], ["Renault", "Kwid E-Tech", "#e9ecef", "hatch"],
      ["GWM", "Ora 03", "#d9a0b8", "hatch"], ["Nissan", "Leaf", "#e4e7ea", "hatch"], ["Porsche", "Taycan", "#2a2f36", "sport"],
      ["BYD", "Song Plus", "#7a8b99", "suv"] ] }
  ];

  // ---------- Ilustrações (vista lateral, frente à direita) ----------
  var SHAPES = {
    hatch: {
      body: "M16 78 L16 66 Q16 60 24 58 L50 54 Q64 32 92 30 L150 30 Q176 32 188 52 L214 58 Q226 60 226 68 L226 78 Q226 82 220 82 L16 82 Z",
      glass: "M66 52 Q76 38 94 37 L120 37 L120 52 Z M125 37 L148 37 Q165 40 175 52 L125 52 Z",
      hl: [216, 62, 9, 5], tl: [16.5, 62, 4.5, 8], extra: ""
    },
    sedan: {
      body: "M10 80 L10 68 Q10 62 18 61 L52 58 Q60 54 68 52 Q84 34 108 33 L146 33 Q168 34 182 52 L212 58 Q228 60 230 70 L230 80 Q230 82 224 82 L10 82 Z",
      glass: "M78 52 Q88 40 106 39 L124 39 L124 52 Z M129 39 L146 39 Q162 41 174 52 L129 52 Z",
      hl: [219, 64, 9, 5], tl: [10.5, 63, 5, 7], extra: ""
    },
    suv: {
      body: "M14 80 L14 56 Q14 50 22 48 L40 46 L54 30 Q58 26 66 26 L160 26 Q172 26 180 38 L190 48 L214 54 Q228 58 228 68 L228 80 Q228 82 222 82 L14 82 Z",
      glass: "M62 46 L68 32 L100 32 L100 46 Z M105 32 L132 32 L132 46 Z M137 32 L158 32 Q167 34 174 46 L137 46 Z",
      hl: [217, 58, 9, 6], tl: [14.5, 52, 4.5, 10],
      extra: '<path class="dark" d="M60 24 L166 24 L166 26 L60 26 Z"/>'
    },
    pickup: {
      body: "M8 80 L8 56 L102 56 L102 44 L112 44 L124 30 Q126 27 132 27 L166 27 Q178 28 186 44 L216 52 Q229 56 229 68 L229 80 Q229 82 223 82 L8 82 Z",
      glass: "M117 43 L127 32 L150 32 L150 43 Z M155 32 L166 32 Q174 34 179 43 L155 43 Z",
      hl: [219, 58, 9, 5], tl: [8.5, 60, 4.5, 9],
      extra: '<path class="dark" d="M12 56 L98 56 L98 61 L12 61 Z"/>'
    },
    sport: {
      body: "M10 78 L10 70 Q10 66 18 64 L70 58 Q92 42 120 40 L150 40 Q172 42 186 56 L216 60 Q230 62 232 70 L232 78 Q232 82 226 82 L10 82 Z",
      glass: "M98 56 Q108 46 126 45 L148 45 Q162 47 172 56 Z",
      hl: [221, 66, 9, 4], tl: [10.5, 66, 5, 5],
      extra: '<path class="dark" d="M10 62 L10 55 L36 55 L36 59 L22 63 Z"/>'
    }
  };
  var uid = 0;
  function wheel(cx) {
    return '<path class="arch" d="M' + (cx - 19) + ' 82 A19 19 0 0 1 ' + (cx + 19) + ' 82 Z"/>' +
      '<circle class="tire" cx="' + cx + '" cy="82" r="15"/>' +
      '<circle class="rim" cx="' + cx + '" cy="82" r="8"/>' +
      '<circle class="hub" cx="' + cx + '" cy="82" r="2.6"/>';
  }
  function carSVG(shape, color) {
    var S = SHAPES[shape] || SHAPES.sedan, id = "g" + (++uid);
    return '<svg class="car" viewBox="0 0 240 104" aria-hidden="true" focusable="false">' +
      '<defs><linearGradient id="' + id + '" x1="0" y1="0" x2="0" y2="1">' +
      '<stop offset="0" stop-color="#fff" stop-opacity=".38"/><stop offset=".45" stop-color="#fff" stop-opacity="0"/>' +
      '<stop offset="1" stop-color="#000" stop-opacity=".28"/></linearGradient></defs>' +
      '<line class="road" x1="0" y1="100" x2="240" y2="100"/>' +
      '<ellipse class="shd" cx="120" cy="98" rx="102" ry="4"/>' +
      '<path class="body" d="' + S.body + '" style="fill:' + color + '"/>' + S.extra +
      '<path d="' + S.body + '" fill="url(#' + id + ')"/>' +
      '<path class="glass" d="' + S.glass + '"/>' +
      wheel(62) + wheel(178) +
      '<rect class="hl" x="' + S.hl[0] + '" y="' + S.hl[1] + '" width="' + S.hl[2] + '" height="' + S.hl[3] + '" rx="1.5"/>' +
      '<rect class="tl" x="' + S.tl[0] + '" y="' + S.tl[1] + '" width="' + S.tl[2] + '" height="' + S.tl[3] + '" rx="1.2"/>' +
      '</svg>';
  }

  // ---------- Utilidades ----------
  var KEY = "qual-carro-campeoes";
  var $ = function (id) { return document.getElementById(id); };
  var reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function norm(s) { return String(s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().trim(); }
  function isHttps(u) { return typeof u === "string" && /^https:\/\//i.test(u.trim()); }
  function shuffle(a) {
    a = a.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1)), t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }
  function nome(c) { return c.marca + " " + c.modelo + (c.detalhe ? " (" + c.detalhe + ")" : ""); }
  function loadSaved() { try { return JSON.parse(localStorage.getItem(KEY) || "{}") || {}; } catch (e) { return {}; } }
  function save(catId, valor) {
    try { var s = loadSaved(); s[catId] = valor; localStorage.setItem(KEY, JSON.stringify(s)); } catch (e) {}
  }
  function show(id) {
    ["home", "game", "end"].forEach(function (s) { $(s).hidden = s !== id; });
    window.scrollTo(0, 0);
  }
  function buzz() { try { if (navigator.vibrate) navigator.vibrate(12); } catch (e) {} }

  // ---------- Categorias e carros ----------
  var ALIAS = { hatch: "hatch", hatches: "hatch", sedan: "sedan", sedas: "sedan", suv: "suv", suvs: "suv",
    picape: "picape", picapes: "picape", pickup: "picape", esportivo: "esportivo", esportivos: "esportivo",
    sport: "esportivo", eletrico: "eletrico", eletricos: "eletrico" };
  var SHAPE_ALIAS = { hatch: "hatch", sedan: "sedan", suv: "suv", picape: "pickup", pickup: "pickup", esportivo: "sport", sport: "sport" };

  var CATS = BASE.map(function (cat) {
    return {
      id: cat.id, nome: cat.nome, desc: cat.desc, shape: cat.shape, comFoto: false,
      list: cat.cars.map(function (c) {
        return { marca: c[0], modelo: c[1], detalhe: "", cor: c[2], shape: c[3] || cat.shape, img: "", autor: "", licenca: "", fonte: "" };
      })
    };
  });

  // Aplica o carros.json: categoria com 4 carros ou mais usa só os carros do arquivo.
  function applyJson(data) {
    var arr = Array.isArray(data) ? data : (data && Array.isArray(data.carros) ? data.carros : []);
    var groups = {};
    arr.forEach(function (it) {
      if (!it || !it.marca || !it.modelo || !it.categoria) return;
      var raw = norm(it.categoria), id = ALIAS[raw] || raw.replace(/[^a-z0-9]+/g, "-");
      if (!id) return;
      (groups[id] = groups[id] || []).push(it);
    });
    Object.keys(groups).forEach(function (id) {
      if (groups[id].length < 4) return;
      var cat = CATS.filter(function (c) { return c.id === id; })[0];
      if (!cat) {
        cat = { id: id, nome: id.charAt(0).toUpperCase() + id.slice(1), desc: "Sua lista", shape: "sedan", comFoto: false, list: [] };
        CATS.push(cat);
      }
      cat.list = groups[id].map(function (it) {
        return {
          marca: String(it.marca), modelo: String(it.modelo), detalhe: String(it.detalhe || ""),
          cor: /^#[0-9a-f]{3,8}$/i.test(it.cor || "") ? it.cor : "#8a96a3",
          shape: SHAPE_ALIAS[norm(it.formato)] || cat.shape,
          img: isHttps(it.imagem) ? it.imagem.trim() : "",
          autor: String(it.autor || ""), licenca: String(it.licenca || ""),
          fonte: isHttps(it.fonte) ? it.fonte.trim() : ""
        };
      });
      cat.comFoto = cat.list.some(function (c) { return c.img; });
    });
  }

  // ---------- Peças de interface ----------
  function stageHTML(c) {
    return '<div class="stage">' + carSVG(c.shape, c.cor) +
      (c.img ? '<img class="foto" src="' + esc(c.img) + '" alt="" decoding="async" referrerpolicy="no-referrer">' : "") +
      '</div>';
  }
  function creditText(c) {
    if (!c.img || (!c.autor && !c.licenca)) return "";
    return "Foto: " + [c.autor, c.licenca].filter(Boolean).join(" · ");
  }
  // Foto carregada: aparece por cima da ilustração. Foto quebrada: sai e a ilustração continua.
  function watchPhotos(root) {
    root.addEventListener("load", function (e) {
      if (e.target.classList && e.target.classList.contains("foto")) e.target.classList.add("ok");
    }, true);
    root.addEventListener("error", function (e) {
      if (e.target.classList && e.target.classList.contains("foto")) e.target.remove();
    }, true);
  }
  function checkCached(root) {
    var imgs = root.querySelectorAll("img.foto");
    for (var i = 0; i < imgs.length; i++) {
      if (imgs[i].complete && imgs[i].naturalWidth > 0) imgs[i].classList.add("ok");
    }
  }
  function preload(c) { if (c && c.img) { var im = new Image(); im.referrerPolicy = "no-referrer"; im.src = c.img; } }

  // ---------- Início ----------
  function renderHome() {
    var saved = loadSaved();
    $("tiles").innerHTML = CATS.map(function (cat) {
      var c = cat.list[0];
      return '<button class="tile" type="button" data-cat="' + esc(cat.id) + '">' +
        '<div class="stage">' + carSVG(c.shape, c.cor) + '</div>' +
        '<div class="tile-name">' + esc(cat.nome) + '</div>' +
        '<div class="tile-desc">' + esc(cat.desc) + '</div>' +
        '<div class="mono" style="color:var(--ink-2)">' + cat.list.length + ' carros' + (cat.comFoto ? ' · fotos' : '') + '</div>' +
        (saved[cat.id] ? '<div class="tile-last">Último campeão: <b>' + esc(saved[cat.id]) + '</b></div>' : '') +
        '</button>';
    }).join("");
    $("foot").hidden = !CATS.some(function (c) { return c.comFoto; });
    show("home");
  }

  // ---------- Jogo ----------
  var st = null;
  function start(catId) {
    var cat = CATS.filter(function (c) { return c.id === catId; })[0];
    if (!cat) return;
    var queue = shuffle(cat.list);
    st = { cat: cat, queue: queue, champ: null, wins: 0, round: 0, total: queue.length - 1, log: [], locked: false, pair: [queue.shift(), queue.shift()] };
    show("game");
    renderDuel();
  }

  function tagFor(car) {
    if (st.round === 0) return '<span class="tag mono">Novo</span>';
    if (car === st.champ) return '<span class="tag keep mono">Sua escolha · ' + st.wins + (st.wins === 1 ? " vitória" : " vitórias") + '</span>';
    return '<span class="tag mono">Desafiante</span>';
  }

  function renderDuel() {
    st.locked = false;
    $("count").textContent = "Rodada " + (st.round + 1) + " de " + st.total;
    $("bar").style.width = (st.round / st.total * 100) + "%";
    $("hint").textContent = st.round === 0
      ? "Toque no carro que você levaria para casa."
      : "O carro que você escolher segue e enfrenta um novo concorrente.";
    $("duel").innerHTML = st.pair.map(function (c, i) {
      var cr = creditText(c);
      return '<button class="car-btn" type="button" data-i="' + i + '" aria-label="' + esc(nome(c)) + '">' +
        '<div><div class="brand mono">' + esc(c.marca) + '</div><div class="name">' + esc(c.modelo) + '</div>' +
        '<div class="det mono">' + esc(c.detalhe) + '</div></div>' +
        stageHTML(c) +
        (cr ? '<div class="credit">' + esc(cr) + '</div>' : '') +
        tagFor(c) +
        '</button>';
    }).join("") + '<div class="vs mono" aria-hidden="true">VS</div>';
    checkCached($("duel"));
    preload(st.queue[0]);
  }

  function pick(i) {
    if (!st || st.locked) return;
    st.locked = true;
    buzz();
    var win = st.pair[i], lose = st.pair[1 - i];
    st.log.push({ r: st.round + 1, w: win, l: lose });
    if (win === st.champ) { st.wins++; } else { st.champ = win; st.wins = 1; }

    var btns = $("duel").querySelectorAll(".car-btn");
    btns[i].classList.add("picked");
    btns[1 - i].classList.add("dim");

    setTimeout(function () {
      st.round++;
      var next = st.queue.shift();
      if (!next) { finish(); return; }
      st.pair = Math.random() < 0.5 ? [st.champ, next] : [next, st.champ];
      renderDuel();
    }, reduce ? 0 : 340);
  }

  // ---------- Fim ----------
  function finish() {
    var c = st.champ;
    save(st.cat.id, nome(c));
    $("bar").style.width = "100%";
    $("endcat").textContent = st.cat.nome;
    var cr = creditText(c), link = "";
    if (cr) {
      link = '<div class="win-credit">' + (c.fonte ? '<a href="' + esc(c.fonte) + '" target="_blank" rel="noopener noreferrer">' + esc(cr) + '</a>' : esc(cr)) + '</div>';
    }
    $("win").innerHTML =
      '<div class="mono" style="color:var(--ink-2)">Seu campeão</div>' +
      stageHTML(c) + link +
      '<div><div class="brand mono" style="color:var(--ink-2)">' + esc(c.marca) + '</div><div class="win-name">' + esc(c.modelo) + '</div>' +
      (c.detalhe ? '<div class="mono" style="color:var(--ink-2);margin-top:4px">' + esc(c.detalhe) + '</div>' : '') + '</div>' +
      '<div class="win-meta">Fechou a partida com ' + st.wins + (st.wins === 1 ? " vitória" : " vitórias seguidas") + ' em ' + st.total + ' rodadas.</div>';
    $("log").innerHTML = st.log.map(function (e) {
      return '<li><span class="n mono">R' + e.r + '</span><span><b>' + esc(nome(e.w)) + '</b> venceu <s>' + esc(nome(e.l)) + '</s></span></li>';
    }).join("");
    show("end");
    checkCached($("win"));
  }

  // ---------- Eventos ----------
  watchPhotos($("duel"));
  watchPhotos($("win"));
  $("tiles").addEventListener("click", function (e) {
    var b = e.target.closest("[data-cat]");
    if (b) start(b.getAttribute("data-cat"));
  });
  $("duel").addEventListener("click", function (e) {
    var b = e.target.closest(".car-btn");
    if (b) pick(+b.getAttribute("data-i"));
  });
  $("back").addEventListener("click", renderHome);
  $("back2").addEventListener("click", renderHome);
  $("other").addEventListener("click", renderHome);
  $("again").addEventListener("click", function () { start(st.cat.id); });

  // ---------- Partida ----------
  renderHome();
  if (window.fetch) {
    fetch("carros.json", { cache: "no-cache" })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (d) { if (d) { applyJson(d); if (!$("home").hidden) renderHome(); } })
      .catch(function () {});
  }
})();
</script>
</body>
</html>
